{{define "_knobs"}}
{{range $kind, $k := .}}
<form method="post" action="/simulator/{{$kind}}">
  <div class="knob-item">
    <div class="knob-header">
      <span class="knob-kind">{{$kind}}</span>
      <button type="submit" class="knob-set" aria-label="Apply {{$kind}} knob settings">set</button>
    </div>
    <div class="knob-fields">
      <div class="knob-field">
        <label for="knob-{{$kind}}-fail">fail %</label>
        <input id="knob-{{$kind}}-fail" type="number" name="failure_rate" step="0.05" min="0" max="1" value="{{$k.FailureRate}}">
      </div>
      <div class="knob-field">
        <label for="knob-{{$kind}}-min">lat min</label>
        <input id="knob-{{$kind}}-min" type="number" name="latency_min_ms" min="0" value="{{$k.LatencyMinMs}}">
      </div>
      <div class="knob-field">
        <label for="knob-{{$kind}}-max">lat max</label>
        <input id="knob-{{$kind}}-max" type="number" name="latency_max_ms" min="0" value="{{$k.LatencyMaxMs}}">
      </div>
    </div>
  </div>
</form>
{{end}}
{{end}}
