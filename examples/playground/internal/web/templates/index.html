<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>not-asap · playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* surfaces */
      --bg:          #07090f;
      --surface:     #0c0f18;
      --surface2:    #111623;
      --surface3:    #161c2d;

      /* borders */
      --border:      #1c2438;
      --border2:     #242d42;

      /* accent – amber */
      --accent:      #f59e0b;
      --accent-hi:   #fbbf24;
      --accent-dim:  rgba(245,158,11,.10);
      --accent-glow: rgba(245,158,11,.18);

      /* text */
      --text:        #d6e0f5;
      --text-dim:    #6b80a6;
      --text-bright: #eef3ff;
      --text-label:  #94aac8;

      /* status */
      --s-new:       #a78bfa;
      --s-running:   #60a5fa;
      --s-done:      #34d399;
      --s-retrying:  #f59e0b;
      --s-failed:    #f87171;
      --s-exhausted: #ef4444;
      --s-cancelled: #475569;

      /* layout */
      --sidebar-w:   22rem;
      --header-h:    2.75rem;

      /* type */
      --mono: 'IBM Plex Mono', 'Fira Code', monospace;
      --sans: 'IBM Plex Sans', system-ui, sans-serif;

      color-scheme: dark;
    }

    html { font-size: 15px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 1rem;
      line-height: 1.5;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: var(--header-h) 1fr;
    }

    /* ── Header ───────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      grid-column: 1 / -1;
    }

    .header-brand {
      display: flex;
      align-items: baseline;
      gap: .375rem;
    }
    .header-brand .name {
      font-family: var(--mono);
      font-size: .875rem;
      font-weight: 600;
      color: var(--text-bright);
      letter-spacing: -.01em;
    }
    .header-brand .sep {
      color: var(--text-dim);
      font-family: var(--mono);
      font-weight: 400;
    }
    .header-brand .sub {
      font-family: var(--sans);
      font-weight: 300;
      font-size: .8125rem;
      color: var(--text-dim);
      letter-spacing: .02em;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-family: var(--mono);
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .12em;
      color: var(--s-done);
    }
    .live-dot {
      width: .5rem;
      height: .5rem;
      border-radius: 50%;
      background: var(--s-done);
      animation: pulse-live 2s ease-in-out infinite;
    }
    @keyframes pulse-live {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(52,211,153,.4); }
      50%       { opacity: .6; box-shadow: 0 0 0 4px rgba(52,211,153,0); }
    }

    /* ── Main Layout ──────────────────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      overflow: hidden;
      height: 100%;
    }

    /* ── Sidebar ──────────────────────────────────────────────── */
    aside {
      border-right: 1px solid var(--border);
      background: var(--surface);
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }

    .section {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .section-label {
      font-family: var(--mono);
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .10em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: .75rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Form Controls ────────────────────────────────────────── */
    .field { margin-bottom: .625rem; }
    .field:last-of-type { margin-bottom: 0; }

    label {
      display: block;
      font-family: var(--mono);
      font-size: .6875rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text-label);
      margin-bottom: .25rem;
    }

    input[type=text],
    input[type=number] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text-bright);
      font-family: var(--mono);
      font-size: .875rem;
      padding: .4375rem .5625rem;
      outline: none;
      border-radius: 2px;
      transition: border-color .12s, box-shadow .12s;
      -moz-appearance: textfield;
    }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .btn {
      display: block;
      width: 100%;
      padding: .5rem .75rem;
      font-family: var(--sans);
      font-size: .875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      border-radius: 2px;
      transition: background .12s, color .12s;
      text-align: center;
    }
    .btn-primary {
      background: var(--accent);
      color: #000;
      margin-top: .625rem;
    }
    .btn-primary:hover { background: var(--accent-hi); }
    .btn-primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: var(--sans);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Scenario Buttons ─────────────────────────────────────── */
    .scenario-btn {
      display: block;
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--sans);
      font-size: .875rem;
      font-weight: 400;
      padding: .5rem .625rem;
      cursor: pointer;
      border-radius: 2px;
      text-align: left;
      margin-bottom: .375rem;
      transition: border-color .12s, background .12s;
      line-height: 1.3;
    }
    .scenario-btn:last-child { margin-bottom: 0; }
    .scenario-btn:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .scenario-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .scenario-btn strong {
      display: block;
      font-weight: 500;
      color: var(--text-bright);
      margin-bottom: .1rem;
    }
    .scenario-btn small {
      font-family: var(--mono);
      font-size: .6875rem;
      color: var(--text-dim);
    }

    /* ── Batch row ────────────────────────────────────────────── */
    .batch-row {
      display: grid;
      grid-template-columns: 4.5rem 1fr;
      gap: .375rem;
      align-items: end;
    }

    /* ── Knobs ────────────────────────────────────────────────── */
    .knob-item {
      padding: .5rem 0;
      border-bottom: 1px solid var(--border);
    }
    .knob-item:last-child { border-bottom: none; }
    .knob-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .375rem;
    }
    .knob-kind {
      font-family: var(--mono);
      font-size: .8125rem;
      font-weight: 500;
      color: var(--accent);
    }
    .knob-set {
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: .6875rem;
      padding: .1875rem .5rem;
      cursor: pointer;
      border-radius: 2px;
      transition: border-color .12s, color .12s;
    }
    .knob-set:hover { border-color: var(--accent); color: var(--accent); }
    .knob-set:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .knob-fields {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: .3125rem;
    }
    .knob-field label { font-size: .625rem; }
    .knob-field input { font-size: .8125rem; padding: .3125rem .4rem; }

    /* ── Main pane ────────────────────────────────────────────── */
    main {
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
      background:
        radial-gradient(ellipse 80% 40% at 50% 0%, rgba(245,158,11,.04) 0%, transparent 60%),
        var(--bg);
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .5625rem .875rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .panel-title {
      font-family: var(--mono);
      font-size: .625rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .panel-tag {
      font-family: var(--mono);
      font-size: .5625rem;
      letter-spacing: .08em;
      color: var(--text-dim);
    }
    .panel-body { padding: .875rem; }

    /* ── Counters ─────────────────────────────────────────────── */
    .counters-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      padding: .875rem;
    }
    .counter-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: .625rem .875rem;
      min-width: 5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .2rem;
      transition: border-color .12s;
    }
    .counter-chip:hover { border-color: var(--border2); }
    .counter-num {
      font-family: var(--mono);
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1;
      color: var(--text-bright);
    }
    .counter-label {
      font-family: var(--mono);
      font-size: .5625rem;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .counter-chip.chip-done      .counter-num { color: var(--s-done); }
    .counter-chip.chip-running   .counter-num { color: var(--s-running); }
    .counter-chip.chip-retrying  .counter-num { color: var(--s-retrying); }
    .counter-chip.chip-failed    .counter-num { color: var(--s-failed); }
    .counter-chip.chip-exhausted .counter-num { color: var(--s-exhausted); }
    .counter-chip.chip-new       .counter-num { color: var(--s-new); }
    .counter-chip.chip-cancelled .counter-num { color: var(--s-cancelled); }

    .counters-empty {
      padding: .875rem;
      font-family: var(--mono);
      font-size: .75rem;
      color: var(--text-dim);
    }

    /* ── Jobs Table ───────────────────────────────────────────── */
    .jobs-table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .8125rem;
    }
    thead th {
      font-family: var(--mono);
      font-size: .5625rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: .5rem .75rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      background: var(--surface2);
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .08s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    td {
      padding: .5rem .75rem;
      vertical-align: middle;
      color: var(--text);
      white-space: nowrap;
    }
    .td-id {
      font-family: var(--mono);
      font-size: .6875rem;
      color: var(--text-dim);
      max-width: 10rem;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .td-kind {
      font-family: var(--mono);
      font-size: .75rem;
      color: var(--accent);
    }
    .td-attempt {
      font-family: var(--mono);
      font-size: .75rem;
      text-align: center;
    }
    .td-ts {
      font-family: var(--mono);
      font-size: .625rem;
      color: var(--text-dim);
    }

    /* ── Status Pills ─────────────────────────────────────────── */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-family: var(--mono);
      font-size: .625rem;
      font-weight: 600;
      letter-spacing: .06em;
      padding: .1875rem .4375rem;
      border-radius: 1px;
      border: 1px solid currentColor;
      white-space: nowrap;
    }
    .pill-dot {
      width: .3125rem;
      height: .3125rem;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .pill-done      { color: var(--s-done);      background: rgba( 52,211,153,.08); }
    .pill-running   { color: var(--s-running);   background: rgba( 96,165,250,.08); animation: blink-running 1.5s ease-in-out infinite; }
    .pill-new       { color: var(--s-new);       background: rgba(167,139,250,.08); }
    .pill-retrying  { color: var(--s-retrying);  background: rgba(245,158, 11,.08); }
    .pill-failed    { color: var(--s-failed);    background: rgba(248,113,113,.08); }
    .pill-exhausted { color: var(--s-exhausted); background: rgba(239, 68, 68,.08); }
    .pill-cancelled { color: var(--s-cancelled); background: rgba( 71, 85,105,.12); }

    @keyframes blink-running {
      0%, 100% { opacity: 1; }
      50%       { opacity: .55; }
    }

    /* ── Empty state ──────────────────────────────────────────── */
    .empty {
      padding: 3rem 1.5rem;
      text-align: center;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: .75rem;
      letter-spacing: .04em;
    }

    /* ── Scrollbar (webkit) ───────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* ── Responsive: stack below 680px ───────────────────────── */
    @media (max-width: 42.5rem) {
      body { overflow: auto; height: auto; display: block; }
      .layout { grid-template-columns: 1fr; height: auto; }
      aside { overflow: visible; }
      main { padding: .75rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-brand">
      <span class="name">not-asap</span>
      <span class="sep">·</span>
      <span class="sub">playground</span>
    </div>
    <div class="live-badge" aria-label="Live feed active">
      <span class="live-dot" aria-hidden="true"></span>
      LIVE
    </div>
  </header>

  <div class="layout">

    <!-- ── Sidebar ── -->
    <aside aria-label="Controls">

      <!-- Create Order -->
      <div class="section">
        <p class="section-label">Create Order</p>
        <form method="post" action="/orders">
          <div class="field">
            <label for="customer">Customer</label>
            <input id="customer" type="text" name="customer" value="Alice" required autocomplete="off">
          </div>
          <div class="field">
            <label for="address">Address</label>
            <input id="address" type="text" name="address" value="123 Main St" required autocomplete="off">
          </div>
          <div class="field">
            <label for="amount">Amount</label>
            <input id="amount" type="number" name="amount" step="0.01" value="100" min="0">
          </div>
          <button type="submit" class="btn btn-primary">Enqueue order → 4 jobs</button>
        </form>
      </div>

      <!-- Scenarios -->
      <div class="section">
        <p class="section-label">Scenarios</p>
        <form method="post" action="/scenarios/happy-path">
          <button type="submit" class="scenario-btn">
            <strong>Happy path</strong>
            <small>3 orders · 0% failure · all reach done</small>
          </button>
        </form>
        <form method="post" action="/scenarios/payment-flake">
          <button type="submit" class="scenario-btn">
            <strong>Payment flake</strong>
            <small>70% failure → exponential backoff</small>
          </button>
        </form>
        <form method="post" action="/scenarios/invalid-address">
          <button type="submit" class="scenario-btn">
            <strong>Invalid address</strong>
            <small>ErrCancel · email skips retries</small>
          </button>
        </form>
        <form method="post" action="/scenarios/batch-100">
          <button type="submit" class="scenario-btn">
            <strong>Batch 100</strong>
            <small>EnqueueBatch · single round-trip</small>
          </button>
        </form>
      </div>

      <!-- Batch -->
      <div class="section">
        <p class="section-label">Batch Reports</p>
        <form method="post" action="/batch/reports">
          <div class="batch-row">
            <div>
              <label for="batch-n">Count</label>
              <input id="batch-n" type="number" name="n" value="50" min="1" max="500">
            </div>
            <button type="submit" class="btn btn-ghost" style="padding:.375rem .5rem; font-size:.75rem;">Enqueue</button>
          </div>
        </form>
      </div>

      <!-- Simulator Knobs -->
      <div class="section">
        <p class="section-label">Simulator</p>
        {{template "_knobs" .Knobs}}
      </div>

    </aside>

    <!-- ── Main ── -->
    <main aria-label="Live telemetry">

      <!-- Counters -->
      <div class="panel" aria-live="polite" aria-label="Job counters">
        <div class="panel-header">
          <span class="panel-title">Counters</span>
          <span class="panel-tag">updates every 1s</span>
        </div>
        <div id="counters" hx-get="/api/counters" hx-trigger="every 1s" hx-swap="innerHTML">
          {{template "_counters" .Counters}}
        </div>
      </div>

      <!-- Jobs -->
      <div class="panel" style="flex:1;" aria-live="polite" aria-label="Recent jobs">
        <div class="panel-header">
          <span class="panel-title">Recent Jobs</span>
          <span class="panel-tag">last 50 · sorted by updated_at</span>
        </div>
        <div class="jobs-table-wrap" id="jobs-table" hx-get="/api/jobs" hx-trigger="every 1s" hx-swap="innerHTML">
          {{template "_jobs_table" .Jobs}}
        </div>
      </div>

    </main>
  </div>

</body>
</html>
