services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notasap_playground
      POSTGRES_USER: notasap
      POSTGRES_PASSWORD: notasap
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notasap -d notasap_playground"]
      interval: 2s
      retries: 15

  app:
    build:
      context: ../..
      dockerfile: examples/playground/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://notasap:notasap@postgres:5432/notasap_playground?sslmode=disable"
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
    ports:
      - "8080:8080"
      - "9090:9090"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
