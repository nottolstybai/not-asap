services:
  postgres:
    image: postgres:16-alpine
    container_name: notasap-testdb
    environment:
      POSTGRES_USER: notasap
      POSTGRES_PASSWORD: notasap
      POSTGRES_DB: notasap_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notasap -d notasap_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
